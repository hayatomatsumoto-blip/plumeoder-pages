<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plume Oder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" allow="fullscreen"></iframe>
  <script>
    var GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbzethsk9EUMiWCpG08psxLN_CVwN9KwmJ89N6xsB1Rkc2ZqwL1Fh4bm3unKXFSh06wN/exec';
    function getTrustedEntryKeyFromHash() {
      var m = (location.hash || '').match(/(?:^#|[#&])k=([^&]+)/);
      try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
    }
    var TRUSTED_ENTRY_KEY = getTrustedEntryKeyFromHash();
    var TOKEN_STORAGE_KEY = 'plumeoder_auth_token_trusted';
    var frame = document.getElementById('app-frame');
    function getStoredToken() {
      try { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; } catch (e) { return ''; }
    }
    function storeToken(token) {
      try { localStorage.setItem(TOKEN_STORAGE_KEY, token); } catch (e) {}
    }
    function buildFrameUrl() {
      var params = [];
      if (TRUSTED_ENTRY_KEY) {
        params.push('trustedKey=' + encodeURIComponent(TRUSTED_ENTRY_KEY));
      }
      var token = getStoredToken();
      if (token) params.push('authToken=' + encodeURIComponent(token));
      return GAS_BASE_URL + '?' + params.join('&');
    }
    frame.src = buildFrameUrl();
    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'cccoderAuthToken') return;
      if (typeof event.origin === 'string' && event.origin.indexOf('googleusercontent.com') === -1 && event.origin !== 'https://script.google.com') {
        return;
      }
      if (event.data.token) storeToken(event.data.token);
    });
  </script>
</body>
</html>
